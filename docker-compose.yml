version: '3.8'

services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: promotion_hub_db
    environment:
      POSTGRES_DB: promotion_hub
      POSTGRES_USER: promotion_user
      POSTGRES_PASSWORD: promotion_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init_db.sql:/docker-entrypoint-initdb.d/init_db.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U promotion_user -d promotion_hub"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - promotion_network

  # Promotion Hub Application
  app:
    build: .
    container_name: promotion_hub_app
    environment:
      - DATABASE_URL=postgresql://promotion_user:promotion_password@db:5432/promotion_hub
      - DB_SCHEMA=promotion_hub
      # Copy your actual credentials from .env
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHANNEL_ID=${TELEGRAM_CHANNEL_ID}
      - TELEGRAM_API_ID=${TELEGRAM_API_ID}
      - TELEGRAM_API_HASH=${TELEGRAM_API_HASH}
      - INSTAGRAM_USERNAME=${INSTAGRAM_USERNAME}
      - INSTAGRAM_PASSWORD=${INSTAGRAM_PASSWORD}
      - INSTAGRAM_SESSION=${INSTAGRAM_SESSION}
      - LINKEDIN_USERNAME=${LINKEDIN_USERNAME}
      - LINKEDIN_PASSWORD=${LINKEDIN_PASSWORD}
      - LINKEDIN_COMPANY_ID=${LINKEDIN_COMPANY_ID}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - DEBUG=False
      - LOG_LEVEL=INFO
      - SCHEDULER_ENABLED=True
      - SCHEDULER_TIMEZONE=Europe/Berlin
      - CONTENT_LANGUAGE=DE
      - MAX_LEADS_PER_JOB=50
      - SCORE_THRESHOLD_INVITE=0.6
      - SCORE_THRESHOLD_SAVE=0.3
      - MAX_INVITES_PER_LEAD=1
      - POST_RETENTION_DAYS=30
      - CLEANUP_ENABLED=True
      - WORK_HOURS_START=9
      - WORK_HOURS_END=18
      - TIMEZONE=Europe/Berlin
      - AI_PROVIDER=openai
      - AI_MODEL=gpt-3.5-turbo
      - USE_AI_CONTENT=True
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
      - ./client_config:/app/client_config
    depends_on:
      db:
        condition: service_healthy
    networks:
      - promotion_network
    restart: unless-stopped

  # Optional: PgAdmin for database management
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: promotion_hub_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@promotionhub.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "8080:80"
    depends_on:
      - db
    networks:
      - promotion_network
    profiles:
      - debug

volumes:
  postgres_data:

networks:
  promotion_network:
    driver: bridge